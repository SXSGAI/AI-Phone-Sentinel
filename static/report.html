<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本周周报 · AI 电话哨兵</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", sans-serif; background: linear-gradient(160deg, #fdf3ec 0%, #fbe8d8 100%); min-height: 100vh; padding: 24px 16px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 18px; }
  header h1 { font-size: 22px; color: #7a4a21; }
  header p { color: #b08a63; font-size: 13px; margin-top: 4px; }
  .card { background: #fff; border-radius: 18px; box-shadow: 0 8px 30px rgba(160,110,60,.15); padding: 22px; margin-bottom: 16px; }
  .card h3 { color: #7a4a21; font-size: 16px; margin-bottom: 14px; }
  .stats { display: flex; gap: 10px; text-align: center; }
  .stat { flex: 1; background: #faf3e8; border-radius: 14px; padding: 14px 6px; }
  .stat b { display: block; font-size: 22px; color: #4caf7d; }
  .stat span { font-size: 12px; color: #a67c4f; }
  svg { width: 100%; height: auto; }
  .day { padding: 12px 0; border-bottom: 1px dashed #f0e4d2; }
  .day:last-child { border: none; }
  .day .head { display: flex; justify-content: space-between; font-size: 13px; color: #a67c4f; margin-bottom: 4px; }
  .day .head .stars { color: #e8a23c; letter-spacing: 1px; }
  .day p { font-size: 14px; color: #5c3a1a; line-height: 1.6; }
  .sig { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px dashed #f0e4d2; font-size: 14px; }
  .sig:last-child { border: none; }
  .tag { flex-shrink: 0; padding: 3px 10px; border-radius: 20px; font-size: 12px; }
  .tag.red { background: #fde8e6; color: #c0392b; }
  .tag.yellow { background: #fdf3d7; color: #b07d10; }
  .tag.blue { background: #e8f1fd; color: #2471a3; }
  .sig .body { color: #5c3a1a; line-height: 1.55; }
  .sig .q { display: block; color: #a67c4f; font-size: 13px; margin-top: 2px; }
  blockquote { background: #faf3e8; border-left: 4px solid #e8a23c; border-radius: 0 12px 12px 0; padding: 14px 16px; font-size: 15px; color: #7a4a21; line-height: 1.8; }
  blockquote footer { font-size: 12px; color: #b08a63; margin-top: 6px; }
  .foot { text-align: center; color: #c4a684; font-size: 12px; margin-top: 8px; line-height: 1.8; }
  a.back { display: block; text-align: center; color: #b08a63; font-size: 14px; margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📄 妈妈本周的“心情周报”</h1>
    <p>订阅用户：建国（儿子） · 每周一早 8:00 推送到微信</p>
  </header>

  <div class="card">
    <h3>本周概览</h3>
    <div class="stats" id="stats"></div>
  </div>

  <div class="card">
    <h3>情绪走势（AI 每日通话自动评估）</h3>
    <div id="curve"></div>
  </div>

  <div class="card">
    <h3>每天聊了什么</h3>
    <div id="days"></div>
  </div>

  <div class="card">
    <h3>🩺 健康提醒记录</h3>
    <div id="sigs"></div>
  </div>

  <div class="card">
    <h3>💛 本周妈妈的一句话</h3>
    <blockquote id="quote">加载中…</blockquote>
  </div>

  <a class="back" href="/">← 返回通话演示</a>
  <p class="foot">AI 电话哨兵 · 儿女买给爸妈的每日陪伴<br>健康提醒仅为生活观察，不构成医疗建议</p>
</div>

<script>
const $ = id => document.getElementById(id);
const stars = n => '★'.repeat(n) + '☆'.repeat(5 - n);

fetch('/api/report').then(r => r.json()).then(d => {
  const mins = Math.round(d.total_duration / 60);
  $('stats').innerHTML = `
    <div class="stat"><b>${d.total_calls}</b><span>本周通话(次)</span></div>
    <div class="stat"><b>${mins}</b><span>陪聊(分钟)</span></div>
    <div class="stat"><b>${d.avg_emotion}</b><span>平均情绪 /5</span></div>
    <div class="stat"><b>${d.signals.filter(s => s.level !== 'blue').length}</b><span>健康提醒</span></div>`;

  // 情绪曲线（内联 SVG，无外部依赖）
  if (d.days.length) {
    const W = 520, H = 170, pad = 30;
    const xs = i => pad + i * ((W - 2 * pad) / Math.max(d.days.length - 1, 1));
    const ys = v => H - 25 - (v - 1) / 4 * (H - 55);
    const pts = d.days.map((x, i) => `${xs(i)},${ys(x.emotion)}`).join(' ');
    $('curve').innerHTML = `
      <svg viewBox="0 0 ${W} ${H}">
        <line x1="${pad}" y1="${ys(1)}" x2="${W - pad}" y2="${ys(1)}" stroke="#f0e4d2"/>
        <line x1="${pad}" y1="${ys(3)}" x2="${W - pad}" y2="${ys(3)}" stroke="#f0e4d2"/>
        <line x1="${pad}" y1="${ys(5)}" x2="${W - pad}" y2="${ys(5)}" stroke="#f0e4d2"/>
        <polyline points="${pts}" fill="none" stroke="#4caf7d" stroke-width="3" stroke-linejoin="round"/>
        ${d.days.map((x, i) => `<circle cx="${xs(i)}" cy="${ys(x.emotion)}" r="5" fill="${x.emotion <= 2 ? '#e57368' : '#4caf7d'}"/>
        <text x="${xs(i)}" y="${ys(x.emotion) - 12}" font-size="11" fill="#a67c4f" text-anchor="middle">${x.emotion}</text>
        <text x="${xs(i)}" y="${H - 6}" font-size="10" fill="#c4a684" text-anchor="middle">${x.date.slice(5)}</text>`).join('')}
      </svg>`;
  }

  $('days').innerHTML = d.days.map(x => `
    <div class="day">
      <div class="head"><span>${x.date} · ${Math.round(x.duration / 60)} 分钟</span><span class="stars">${stars(x.emotion)}</span></div>
      <p>${x.summary}</p>
    </div>`).join('');

  const label = { red: '🔴 需要关注', yellow: '🟡 建议留意', blue: '🔵 一般提及' };
  $('sigs').innerHTML = d.signals.length
    ? d.signals.map(s => `
      <div class="sig">
        <span class="tag ${s.level}">${label[s.level]} · ${s.keyword}</span>
        <span class="body">${s.ts.slice(5, 16)}${s.quote ? `<span class="q">“${s.quote}”</span>` : ''}</span>
      </div>`).join('')
    : '<p style="color:#a67c4f;font-size:14px">本周暂无健康相关提醒 🎉</p>';

  $('quote').innerHTML = d.weekly_quote
    ? `${d.weekly_quote}<footer>—— ${d.profile.call_name}，本周三通话</footer>`
    : '本周暂无记录';
}).catch(e => { $('quote').textContent = '加载失败：' + e; });
</script>
</body>
</html>
